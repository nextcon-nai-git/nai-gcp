# Configurações para o Firebase App Hosting.
# Nome do ambiente: nai

runConfig:
  # Memória das instâncias de execução do app (1 GiB).
  memoryMiB: 1024
  maxInstances: 1

env:
  # Clinical portal isolation rules published and verified before enabling.
  - variable: CLINIC_PORTAL_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Compilation/type-checking needs a larger heap; runtime memory is unchanged.
  - variable: NODE_OPTIONS
    value: --max-old-space-size=6144
    availability:
      - BUILD
  - variable: AVP_SYNC_INVOKER_EMAIL
    value: firebase-app-hosting-compute@studio-8439299034-125c7.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: AVP_SYNC_AUDIENCE
    value: https://nai--studio-8439299034-125c7.us-central1.hosted.app/api/internal/avp-sheet-sync
    availability:
      - RUNTIME
  - variable: AVP_CLINIC_SEARCH_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: GEMINI_MODEL
    value: gemini-3.8-flash
    availability:
      - RUNTIME
  - variable: RD_CONVERSAS_WEBHOOK_SECRET
    secret: RD_CONVERSAS_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: RD_CONVERSAS_AVP_PHONES
    secret: RD_CONVERSAS_AVP_PHONES
    availability:
      - RUNTIME
  - variable: RD_CONVERSAS_DIAGNOSTICS_UNTIL
    value: "2026-10-17T08:00:00Z"
    availability:
      - RUNTIME
  - variable: TALLOS_API_TOKEN
    secret: TALLOS_API_TOKEN
    availability:
      - RUNTIME
  # SOC scope verified in screen 733. Reads stay disabled until the separate keys are provisioned.
  - variable: SOC_PRINCIPAL_COMPANY_ID
    value: "1005519"
    availability:
      - RUNTIME
  - variable: SOC_ALLOWED_COMPANY_IDS
    value: "2306171"
    availability:
      - RUNTIME
  - variable: SOC_COMPANIES_CODE
    value: "185065"
    availability:
      - RUNTIME
  - variable: SOC_EMPLOYEES_CODE
    value: "155091"
    availability:
      - RUNTIME
  - variable: SOC_ASOS_CODE
    value: "221493"
    availability:
      - RUNTIME
  # Scheduled webhook worker; provision the scheduler after deploying its indexes.
  - variable: WEBHOOK_INVOKER_EMAIL
    value: firebase-app-hosting-compute@studio-8439299034-125c7.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: WEBHOOK_WORKER_AUDIENCE
    value: https://nai--studio-8439299034-125c7.us-central1.hosted.app/api/internal/webhook-deliveries
    availability:
      - RUNTIME
