
# Mutações do Conector NAI

# Scaffold administrativo sem política multiempresa. Somente contexto Admin SDK.
# O aplicativo atual usa os fluxos autenticados de Firestore; não publicar acesso cliente aqui.
mutation CreateCompany($name: String!, $cnpj: String!, $riskDegree: Int) @auth(level: NO_ACCESS) {
  company_insert(data: {
    name: $name,
    cnpj: $cnpj,
    riskDegree: $riskDegree
  })
}

mutation UpdateUserProfile($id: String!, $name: String!) @auth(level: NO_ACCESS) {
  userProfile_update(id: $id, data: { name: $name })
}
