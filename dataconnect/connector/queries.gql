
# Consultas do Conector NAI

# O scaffold não implementa isolamento multiempresa. Acesso somente via Admin SDK.
query ListCompanies($limit: Int = 10) @auth(level: NO_ACCESS) {
  companies(limit: $limit) {
    id
    name
    cnpj
    riskDegree
  }
}

query GetUserProfile($id: String!) @auth(level: NO_ACCESS) {
  userProfile(id: $id) {
    name
    role
    email
  }
}
