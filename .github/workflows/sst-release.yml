name: Publicar serviço de auditoria SST
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sst-release.yml"
      - "functions/audit-s2220/**"
      - "src/lib/genkit/flows/audit-s2220.ts"
      - "src/lib/genkit/s2220-contract.ts"
      - "src/lib/genkit/resilient-runner.ts"
      - "src/lib/genkit/router.ts"
      - "src/lib/genkit/vertex-content.ts"
      - "src/lib/logging/gcp-logger.ts"
      - "src/services/esocial/s2220-audit-access.ts"
      - "scripts/setup-ai-resilience-metrics.mjs"
      - "scripts/build-s2220-function.mjs"
      - "scripts/security/**"
      - "src/lib/auth/claims.ts"
      - "src/lib/esocial-official-tables.json"
      - "src/lib/esocial-codes.ts"
      - "src/lib/cpf.ts"
      - "src/lib/cnpj.ts"
      - "src/lib/esocial-events.ts"
      - "src/firebase/config.ts"
      - "src/lib/genkit/providers.ts"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
concurrency:
  group: release-nai-s2220
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 25
    env:
      GOOGLE_CLOUD_PROJECT: studio-8439299034-125c7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build:s2220-function
      - name: Instalar as dependências isoladas da Cloud Function
        run: npm ci --prefix functions/audit-s2220 --prefer-offline --no-audit
      - name: Conferir o manifesto local da função v2
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { auditS2220 } = require('./functions/audit-s2220');
          assert.equal(auditS2220.__endpoint.platform, 'gcfv2');
          assert.ok(auditS2220.__endpoint.callableTrigger);
          NODE
      - name: Conferir identidade para publicação em produção
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SST_DEPLOY_SERVICE_ACCOUNT == ''
        env:
          HAS_DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [ "$HAS_DEPLOY_CREDENTIAL" != true ]; then
            echo "::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER e GCP_SST_DEPLOY_SERVICE_ACCOUNT no ambiente production ou disponibilize a credencial de deploy já existente. As métricas e a função ainda não foram publicadas."
            exit 1
          fi
      - name: Autenticar com identidade federada de SST
        id: federated
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SST_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SST_DEPLOY_SERVICE_ACCOUNT }}
          project_id: studio-8439299034-125c7
      - name: Usar credencial de publicação existente quando não houver identidade federada
        if: steps.federated.outcome == 'skipped'
        id: credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: studio-8439299034-125c7
      - name: Provisionar métricas de resiliência
        id: metrics
        run: npm run infra:ai-metrics
      - name: Publicar somente a função de auditoria S-2220
        if: ${{ !cancelled() && (steps.credentials.outcome == 'success' || steps.federated.outcome == 'success') }}
        run: npx --yes firebase-tools@15.33.0 deploy --only functions:s2220-audit --project studio-8439299034-125c7 --non-interactive
