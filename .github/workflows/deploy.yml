name: Firebase validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_firestore:
        description: Deploy tested Firestore/Storage rules and indexes (requires configured credentials)
        required: false
        type: boolean
        default: false
      provision_esocial:
        description: Verify empty A1 vault and configure query-only scheduler after operator bootstrap
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run tests
        run: npm run test:run

      - name: Test eSocial infrastructure safety
        run: node --test scripts/setup-esocial-infrastructure.test.mjs

      - name: Verify dependency security backports
        run: npm run test:dependency-security

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore security rules
        id: rules
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee firebase-rules-test.log

      - name: Preserve failed emulator diagnostics
        if: failure() && steps.rules.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: firebase-emulator-diagnostics
          path: |
            firebase-rules-test.log
            firestore-debug.log
            storage-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-8439299034-125c7
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # The website is released by the connected App Hosting backend from main.
  # Rules/indexes are a separate, explicitly requested deployment.
  deploy-firestore:
    name: Deploy tested Firestore rules and indexes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_firestore
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prepare Firebase release credentials
        env:
          NAI_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const value = process.env.NAI_FIREBASE_SERVICE_ACCOUNT_JSON;
          try {
            const account = JSON.parse(value || 'null');
            if (!account?.client_email || !account?.private_key) throw new Error();
            const credentialsPath = path.join(process.env.RUNNER_TEMP, 'nai-firebase-service-account.json');
            fs.writeFileSync(credentialsPath, value, { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialsPath}\n`);
          } catch {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON ausente ou inválido.');
          }
          NODE

      - name: Deploy tested Firestore and Storage rules
        run: npx --yes firebase-tools@14.22.0 deploy --only firestore:rules,firestore:indexes,storage --project studio-8439299034-125c7 --non-interactive

      - name: Remove temporary release credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/nai-firebase-service-account.json"

  provision-esocial:
    name: Verify empty eSocial vault and configure query worker
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.provision_esocial
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: nai-production-esocial-infrastructure
      cancel-in-progress: false
    steps:
      - name: Checkout tested code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check keyless deployment configuration
        env:
          NAI_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          NAI_DEPLOY_ACCOUNT: ${{ vars.GCP_ESOCIAL_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const provider = process.env.NAI_WIF_PROVIDER || '';
          const account = process.env.NAI_DEPLOY_ACCOUNT || '';
          if (!/^projects\/\d+\/locations\/global\/workloadIdentityPools\/[^/]+\/providers\/[^/]+$/.test(provider) ||
              account !== 'nai-esocial-deploy@studio-8439299034-125c7.iam.gserviceaccount.com') {
            throw new Error('Configure GCP_WORKLOAD_IDENTITY_PROVIDER e GCP_ESOCIAL_DEPLOY_SERVICE_ACCOUNT no ambiente production; siga docs/ESOCIAL_INFRASTRUCTURE.md. Nenhuma chave JSON é usada.');
          }
          NODE
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: studio-8439299034-125c7
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ESOCIAL_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      # IAM/bootstrap is an operator action, never a recurring pipeline permission.
      # Indexes use their own workflow and service account.
      - name: Configure authenticated query scheduler with an empty vault
        run: node scripts/setup-esocial-infrastructure.mjs --apply --require-empty
      - name: Verify provisioned metadata without reading certificate material
        run: node scripts/setup-esocial-infrastructure.mjs --verify --require-empty

