name: Firebase validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_firestore:
        description: Deploy tested Firestore rules and indexes (requires configured credentials)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore security rules
        run: npm run test:rules

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-8439299034-125c7
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # The website is released by the connected App Hosting backend from main.
  # Rules/indexes are a separate, explicitly requested deployment.
  deploy-firestore:
    name: Deploy tested Firestore rules and indexes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_firestore
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prepare Firebase release credentials
        env:
          NAI_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const value = process.env.NAI_FIREBASE_SERVICE_ACCOUNT_JSON;
          try {
            const account = JSON.parse(value || 'null');
            if (!account?.client_email || !account?.private_key) throw new Error();
            const credentialsPath = path.join(process.env.RUNNER_TEMP, 'nai-firebase-service-account.json');
            fs.writeFileSync(credentialsPath, value, { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialsPath}\n`);
          } catch {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON ausente ou inválido.');
          }
          NODE

      - name: Deploy tested Firestore rules
        run: npx --yes firebase-tools@14.22.0 deploy --only firestore:rules,firestore:indexes --project studio-8439299034-125c7 --non-interactive

      - name: Remove temporary release credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/nai-firebase-service-account.json"
