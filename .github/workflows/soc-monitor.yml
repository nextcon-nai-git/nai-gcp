name: SOC morning monitor
on:
  schedule:
    - cron: "0 10 * * *" # 07:00 America/Sao_Paulo
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soc-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.SOC_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read active authorized companies and issued ASOs in bounded batches
        env:
          SOC_MONITOR_SECRET: ${{ secrets.SOC_MONITOR_SECRET }}
        run: python3 scripts/soc/monitor.py
