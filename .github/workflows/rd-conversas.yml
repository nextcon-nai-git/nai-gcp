name: RD Conversas webhook tests
on:
  pull_request:
    paths:
      - "src/lib/integrations/rd-conversas-webhook.ts"
      - "src/app/api/integrations/rd-conversas/**"
      - "tests/integrations/rd-conversas-webhook.test.mjs"
      - ".github/workflows/rd-conversas.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/integrations/rd-conversas-webhook.ts"
      - "src/app/api/integrations/rd-conversas/**"
      - "tests/integrations/rd-conversas-webhook.test.mjs"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --experimental-strip-types --test tests/integrations/rd-conversas-webhook.test.mjs
